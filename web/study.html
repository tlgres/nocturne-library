<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#09090e">
  <title>Study · 해체된 의미의 서재</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css?v=0.22">
  <link rel="icon" type="image/png" href="assets/nata.png">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="shell">
    <header class="topbar">
      <div class="identity">
        <div class="brand">해체된 의미의 서재</div>
        <div class="crumbs"><span id="category-name">서재</span><span class="sep">/</span><a id="series-name" class="series-book-link" href="#">Loading…</a></div>
      </div>
      <div class="top-actions">
        <a class="chrome-button chrome-icon-button library-home-link" href="index.html" title="홈으로 돌아가기" aria-label="홈으로 돌아가기">🏠</a>
        <label class="select-wrap category-select-wrap" title="카테고리 선택">
          <span>분류</span>
          <select id="category-select" aria-label="카테고리 선택"></select>
        </label>
        <label class="select-wrap" title="시리즈 선택">
          <span>시리즈</span>
          <select id="series-select" aria-label="시리즈 선택"></select>
        </label>
        <label class="select-wrap" title="강의 선택">
          <span>강의</span>
          <select id="lecture-select" aria-label="강의 선택"></select>
        </label>
        <button id="study-search-toggle" class="chrome-button chrome-icon-button" type="button" title="현재 강의 또는 시리즈 본문 검색" aria-label="본문 검색">🔍</button>
        <button id="lecture-toc-toggle" class="chrome-button chrome-icon-button" type="button" title="이 강의의 목차" aria-label="강의 목차">☰</button>
        <button id="bookmark-toggle" class="chrome-button chrome-icon-button" type="button" title="책갈피" aria-label="책갈피">☆</button>
        <button id="lecture-note-toggle" class="chrome-button chrome-icon-button" type="button" title="이 강의의 개인 메모" aria-label="개인 메모">📝</button>
        <button id="immersive-toggle" class="chrome-button" type="button" aria-pressed="false" title="집중 모드">Focus</button>
        <button id="companion-toggle" class="chrome-button chrome-icon-button" type="button" aria-pressed="true" title="상호작용 표시 방식" aria-label="상호작용 표시 방식">💬</button>
        <button id="reader-settings-toggle" class="chrome-button" type="button" aria-expanded="false" title="읽기 설정">Aa</button>
      </div>
    </header>

    <section id="reader-settings" class="reader-settings" hidden>
      <label><span>Font</span><select id="reader-font-select">
        <option value="sans">Modern Sans</option>
        <option value="gothic">Korean Gothic</option>
        <option value="serif">Book Serif</option>
        <option value="myeongjo">Korean Serif</option>
        <option value="system">System UI</option>
        <option value="custom">Custom</option>
      </select></label>
      <label id="reader-custom-font-wrap" class="reader-custom-font" hidden><span>Custom font</span><input id="reader-custom-font" type="text" placeholder='예: "Pretendard", sans-serif' autocomplete="off"></label>
      <label><span>Size</span><input id="reader-font-size" type="range" min="14" max="22" step="0.5"><output id="reader-font-size-value"></output></label>
      <label><span>Line</span><input id="reader-line-height" type="range" min="1.45" max="2.2" step="0.05"><output id="reader-line-height-value"></output></label>
      <label><span>Align</span><select id="reader-align-select"><option value="left">왼쪽 정렬</option><option value="justify">양쪽 정렬</option></select></label>
      <label><span>Width</span><select id="reader-width-select"><option value="narrow">좁게</option><option value="default">기본</option><option value="wide">넓게</option></select></label>
      <label><span>Paragraph</span><select id="reader-paragraph-select"><option value="compact">촘촘</option><option value="default">기본</option><option value="wide">넓게</option></select></label>
      <label><span>Links</span><select id="reader-link-mode"><option value="show">링크 표시</option><option value="text">텍스트만</option></select></label>
      <button id="reader-settings-reset" type="button">Reset</button>
    </section>

    <section class="lecture-head">
      <div class="lecture-copy">
        <div class="eyebrow" id="lecture-index">Lecture</div>
        <h1 id="lecture-title">Loading…</h1>
        <p id="series-description" class="series-description"></p>
      </div>
      <div class="progress-box">
        <div class="progress-meta"><span id="progress-label">0 / 0</span><span id="block-state">NORMAL</span></div>
        <div id="progress" class="progress" aria-label="강의 진행도"></div>
      </div>
    </section>

    <div id="notice" class="notice" hidden></div>

    <section class="study-grid" id="study-grid">
      <div class="study-column">
        <section id="reader" class="reader" aria-live="polite"></section>
        <nav class="section-nav" aria-label="본문 탐색">
          <button id="prev-section" type="button">← Prev</button>
          <div class="section-count" id="section-count">0 / 0</div>
          <button id="next-section" type="button">Next →</button>
        </nav>
      </div>

      <aside id="character-stage" class="character-stage" aria-label="Nocturne companion stage" data-block-type="normal">
        <div class="room-vignette" aria-hidden="true"></div>
        <div class="night-window" aria-hidden="true">
          <img id="window-constellation" class="window-constellation" alt="" src="">
          <span class="star star-a">✧</span>
          <span class="star star-b">✦</span>
          <span class="star star-c">✧</span>
          <span class="star star-d">✦</span>
          <span class="star star-e">✧</span>
          <span class="star star-f">✦</span>
          <span class="star star-g">✧</span>
          <span class="star star-h">✦</span>
        </div>
        <div class="wood-floor" aria-hidden="true"></div>
        <div id="stage-status" class="stage-status">NORMAL</div>
        <div id="stage-view-tabs" class="stage-view-tabs" hidden>
          <button id="stage-view-companions" type="button" data-stage-view="companions">Companions</button>
          <button id="stage-view-video" type="button" data-stage-view="video">Video</button>
        </div>

        <section id="stage-video-panel" class="stage-video-panel" hidden aria-label="강의 보조 영상">
          <div class="stage-video-frame">
            <iframe id="stage-video-frame" title="강의 보조 YouTube 영상" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
          <div class="stage-video-meta"><span>LECTURE VIDEO</span><a id="stage-video-open" href="#" target="_blank" rel="noopener noreferrer">YouTube에서 열기 ↗</a></div>
        </section>

        <div id="char-mute" class="character-layer mute is-listener">
          <canvas id="char-mute-canvas" class="character-canvas" data-character-canvas="MUTE"></canvas>
          <div class="character-fallback" aria-hidden="true">M</div>
          <div class="character-tag">뮤트</div>
        </div>
        <div id="char-ed" class="character-layer ed is-listener">
          <canvas id="char-ed-canvas" class="character-canvas" data-character-canvas="ED"></canvas>
          <div class="character-fallback" aria-hidden="true">E</div>
          <div class="character-tag">이드</div>
        </div>

        <div id="quiz-message" class="quiz-message" hidden></div>
        <div id="cast-message" class="cast-message cast-message-full" hidden></div>
      </aside>
    </section>



    <aside id="message-dock" class="message-dock" hidden aria-live="polite">
      <div class="message-dock-header">
        <div id="message-dock-status" class="message-dock-status">MESSAGE</div>
        <button id="message-dock-toggle" class="message-dock-toggle" type="button" aria-expanded="true" aria-label="메시지 접기" title="메시지 접기">−</button>
      </div>
      <div id="message-dock-body" class="message-dock-body">
        <div id="message-quiz" class="message-quiz" hidden></div>
        <div id="message-cast" class="message-cast" hidden></div>
      </div>
    </aside>

    <dialog id="study-search-dialog" class="study-search-dialog">
      <div class="study-search-card">
        <header><div><small>TEXT SEARCH</small><strong>본문 검색</strong></div><button id="study-search-close" type="button" aria-label="닫기">×</button></header>
        <div class="study-search-controls">
          <input id="study-search-input" type="search" placeholder="현재 강의 또는 시리즈에서 검색">
          <select id="study-search-scope" aria-label="검색 범위"><option value="lecture">현재 강의</option><option value="series">현재 시리즈</option></select>
        </div>
        <div id="study-search-summary" class="study-search-summary">검색어를 입력하세요.</div>
        <div id="study-search-results" class="study-search-results"></div>
        <div id="study-search-pager" class="pager" hidden></div>
      </div>
    </dialog>


    <dialog id="lecture-toc-dialog" class="reader-tool-dialog">
      <div class="reader-tool-card">
        <header><div><small>LECTURE MAP</small><strong>강의 목차</strong></div><button id="lecture-toc-close" type="button" aria-label="닫기">×</button></header>
        <div id="lecture-toc-list" class="reader-tool-list"></div>
      </div>
    </dialog>

    <dialog id="bookmark-dialog" class="reader-tool-dialog">
      <div class="reader-tool-card">
        <header><div><small>BOOKMARKS</small><strong>책갈피</strong></div><button id="bookmark-close" type="button" aria-label="닫기">×</button></header>
        <button id="bookmark-current" class="bookmark-current" type="button">☆ 현재 구간 저장</button>
        <div id="bookmark-list" class="reader-tool-list bookmark-list"></div>
      </div>
    </dialog>

    <aside id="lecture-note-panel" class="lecture-note-panel" hidden aria-label="강의 개인 메모">
      <header><div><small>LOCAL NOTE</small><strong>강의 메모</strong></div><button id="lecture-note-close" type="button" aria-label="메모 닫기">×</button></header>
      <textarea id="lecture-note-text" placeholder="이 강의를 읽으며 남길 메모…" spellcheck="false"></textarea>
      <div class="lecture-note-footer"><span>이 기기에만 자동 저장됩니다.</span><div><button id="lecture-note-copy" type="button">복사</button><button id="lecture-note-clear" type="button">지우기</button></div></div>
    </aside>

    <dialog id="media-lightbox" class="media-lightbox">
      <button id="media-lightbox-close" type="button" aria-label="이미지 닫기">×</button>
      <img id="media-lightbox-image" alt="">
      <div id="media-lightbox-caption"></div>
    </dialog>

    <nav class="lecture-nav" aria-label="강의 탐색">
      <button id="prev-lecture" type="button">← 이전 강의</button>
      <button id="next-lecture" type="button">다음 강의 →</button>
    </nav>

    <footer>
      <span id="status">Nocturne Format 1.0</span>
      <span>해체된 의미의 서재 · Study View</span>
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="core.js?v=0.21.1"></script>
  <script src="character.js?v=0.21.1"></script>
  <script src="app.js?v=0.22"></script>
</body>
</html>

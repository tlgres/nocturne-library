<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>해체된 의미의 서재 · Authoring Wizard</title>
  <link rel="stylesheet" href="wizard.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">AUTHORING TOOL</div>
      <h1>해체된 의미의 서재 · Wizard</h1>
    </div>
    <div class="repo-strip">
      <span id="repoState" class="repo-state">Repository 미선택</span>
      <button id="reconnectBtn" class="ghost">최근 폴더 다시 연결</button>
      <button id="chooseRepoBtn" class="primary">Repository 폴더 선택</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="side-head">
        <div><span class="eyebrow">LIBRARY</span><h2>서재</h2></div>
        <button id="newSeriesBtn" class="icon-btn" title="새 시리즈">＋</button>
      </div>
      <div id="libraryTree" class="library-tree"><p class="muted">Repository를 선택하세요.</p></div>
    </aside>

    <section class="editor">
      <div class="editor-toolbar">
        <div class="field compact"><label>카테고리</label><select id="categorySelect"></select></div>
        <div class="field series-field"><label>시리즈</label><select id="seriesSelect"></select></div>
        <button id="newLectureBtn" class="ghost">＋ 새 강의</button>
      </div>

      <div id="modeBanner" class="mode-banner">새 강의</div>

      <div class="meta-grid">
        <div class="field wide"><label>강의 제목</label><input id="lectureTitle" placeholder="붙여넣으면 H1 제목을 자동 추출합니다"></div>
        <div class="field"><label>Lecture ID</label><input id="lectureId" placeholder="03"></div>
        <div class="field"><label>파일</label><input id="lectureFile" placeholder="03.md"></div>
      </div>

      <div class="paste-head">
        <div><span class="eyebrow">SOURCE</span><h2>Nocturne 강의</h2></div>
        <div class="source-actions"><button id="analyzeBtn" class="ghost">다시 분석</button><button id="clearBtn" class="ghost danger">비우기</button></div>
      </div>
      <textarea id="sourceInput" spellcheck="false" placeholder="# 강의 제목\n\n[[NORMAL]]\n...\n[[END]]"></textarea>

      <section id="speakerPanel" class="speaker-panel hidden">
        <div class="section-head"><div><span class="eyebrow">DIALOGUE</span><h2>화자 프로필</h2></div><span class="muted">시리즈 공통 metadata에 저장</span></div>
        <div id="speakerList" class="speaker-list"></div>
      </section>

      <div class="bottom-grid">
        <section class="validation-panel">
          <div class="section-head"><div><span class="eyebrow">VALIDATION</span><h2>검사</h2></div><span id="validationSummary" class="status-pill">대기</span></div>
          <div id="stats" class="stats"></div>
          <div id="issues" class="issues"><p class="muted">강의를 붙여넣으면 검사합니다.</p></div>
        </section>
        <section class="preview-panel">
          <div class="section-head"><div><span class="eyebrow">PREVIEW</span><h2>구조 미리보기</h2></div></div>
          <div id="preview" class="preview"><p class="muted">미리보기 없음</p></div>
        </section>
      </div>

      <footer class="savebar">
        <div id="saveMessage" class="save-message">저장 전입니다.</div>
        <button id="saveBtn" class="primary large" disabled>강의 저장</button>
      </footer>
    </section>
  </main>

  <dialog id="seriesDialog">
    <form method="dialog" id="seriesForm" class="dialog-form">
      <div class="section-head"><div><span class="eyebrow">NEW SERIES</span><h2>새 시리즈</h2></div><button value="cancel" class="icon-btn">×</button></div>
      <div class="field"><label>카테고리</label><select id="newSeriesCategory"></select></div>
      <div class="field"><label>Series ID</label><input id="newSeriesId" placeholder="topology-theology" required></div>
      <div class="field"><label>제목</label><input id="newSeriesTitle" required></div>
      <div class="field"><label>설명</label><textarea id="newSeriesDescription" rows="3"></textarea></div>
      <div class="field"><label>종류</label><select id="newSeriesKind"><option value="lecture">강의</option><option value="diary">유성 기록</option><option value="journal">궤도 문헌실</option></select></div>
      <div class="dialog-actions"><button value="cancel" class="ghost">취소</button><button id="createSeriesBtn" value="default" class="primary">생성</button></div>
    </form>
  </dialog>

  <script src="../../core.js"></script>
  <script src="repository.js"></script>
  <script src="validator.js"></script>
  <script src="preview.js"></script>
  <script src="wizard.js"></script>
</body>
</html>
